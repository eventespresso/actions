name: 'Install WP Tests'
description: 'This action installs wp for tests'
author: 'eventespresso'
inputs:
    database:
        required: true
        description: 'The database name.'
    username:
        required: true
        description: 'The database username.'
    password:
        required: true
        description: 'The database password.'
    host:
        required: true
        description: 'The database host.'
        default: localhost
    wp-version:
        required: true
        description: 'The WordPress version'
        default: latest
runs:
    using: 'composite'
    steps:
        - name: Install SVN
          if: runner.environment != 'self-hosted'
          run: sudo apt-get install -y subversion
          shell: bash

        # Self-hosted runners keep the test DB between jobs; install-wp-tests.sh expects to create it.
        - name: Drop the test database (self-hosted)
          if: runner.environment == 'self-hosted'
          env:
              DB_NAME: ${{ inputs.database }}
              DB_USER: ${{ inputs.username }}
              DB_PASS: ${{ inputs.password }}
              DB_HOST: ${{ inputs.host }}
          run: mysql --user="$DB_USER" --password="$DB_PASS" --host="$DB_HOST" --execute="DROP DATABASE IF EXISTS \`$DB_NAME\`"
          shell: bash

        - run: ${{ github.action_path }}/install-wp-tests.sh ${{ inputs.database }} ${{ inputs.username }} ${{ inputs.password }} ${{ inputs.host }} ${{ inputs.wp-version }}
          shell: bash
          env:
              # The ee-runner image prefetches WordPress into /opt/wp/<version>.
              WP_CACHE_ROOT: ${{ runner.environment == 'self-hosted' && '/opt/wp' || '' }}

        # PHP before 7.4.4 can't log in with caching_sha2_password (MySQL 8's default), so switch the user to
        # mysql_native_password. MySQL 8.4+ (ubuntu-26.04 image) ships that plugin off, so turn it on first.
        - name: Fix MySQL authentication for PHP < 7.4.4
          env:
              DB_NAME: ${{ inputs.database }}
              DB_USER: ${{ inputs.username }}
              DB_PASS: ${{ inputs.password }}
              DB_HOST: ${{ inputs.host }}
          run: |
              if php -r 'exit(PHP_VERSION_ID >= 70404 ? 0 : 1);' 2>/dev/null; then
                  echo "PHP $(php -r 'echo PHP_VERSION;') supports caching_sha2_password; nothing to change."
                  exit 0
              fi
              status=$(mysql --user="$DB_USER" --password="$DB_PASS" --skip-column-names --execute="SELECT PLUGIN_STATUS FROM information_schema.PLUGINS WHERE PLUGIN_NAME = 'mysql_native_password';")
              if [ "$status" != "ACTIVE" ]; then
                  printf '[mysqld]\nmysql_native_password = ON\n' | sudo tee /etc/mysql/conf.d/mysql-native-password.cnf >/dev/null
                  sudo systemctl restart mysql.service
              fi
              mysql --user="$DB_USER" --password="$DB_PASS" --database="$DB_NAME" --execute="ALTER USER '$DB_USER'@'$DB_HOST' IDENTIFIED WITH mysql_native_password BY '$DB_PASS';"
          shell: bash
